[server]
url=http://localhost:5000/wps
language=en-US
encoding=utf-8
workdir=work
outputpath=outputs
outputurl=http://localhost:5000/outputs/
parallelprocesses=1
maxprocesses=5
maxrequestsize=1mb
maxsingleinputsize=1mb

[metadata:main]
identification_title=EOS-04 SAR Processing Service
identification_abstract=Small WPS for EOS-04 (RISAT-1A) C-band SAR data. It can cut a bounding box, calibrate to sigma0 and remove speckle. The scenes we have are listed in each process abstract and at /scenes.
identification_keywords=EOS-04,RISAT-1A,SAR,C-band,WPS,backscatter
identification_fees=None
identification_accessconstraints=None
provider_name=CyberGIS project
provider_url=https://www.iiit.ac.in/
contact_name=Aryan Agrawal
contact_city=Hyderabad
contact_postalcode=500032
contact_country=India
contact_email=aryan.a@research.iiit.ac.in

[logging]
level=INFO
file=logs/pywps.log

[processing]
# Supported Linux backend avoids Python 3.14 forkserver pickling of PyWPS IO objects.
mode=detachprocessing
